<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snowball Slinger — social image renderer</title>
<style>
  html, body { margin: 0; background: #122a45; overflow: hidden; }
  /* og mode: the real 3D game (level 12, no UI) with the title composed on top */
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
  #titles {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center; color: #fff;
  }
  .t-snowball {
    margin-top: 5.5vh; font-size: 44px; font-weight: 900; letter-spacing: 0.4em;
    color: #dff1ff; text-shadow: 0 3px 0 rgba(18,42,69,0.65);
  }
  .t-slinger {
    font-size: 118px; font-weight: 900; line-height: 1; letter-spacing: 0.02em;
    color: #ffffff; -webkit-text-stroke: 3px rgba(18,42,69,0.5);
    text-shadow: 0 7px 0 rgba(18,42,69,0.45);
  }
  .t-sub {
    margin-top: 12px; font-size: 27px; font-weight: 800; color: #122a45;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
  }
  body.icon #titles { display: none; }
  #iconCanvas { display: none; }
  body.icon #scene { display: none; }
  body.icon #iconCanvas { display: block; }
</style>
</head>
<body>
<iframe id="scene" src="../index.html?og" scrolling="no"></iframe>
<div id="titles">
  <div class="t-snowball">S N O W B A L L</div>
  <div class="t-slinger">SLINGER</div>
  <div class="t-sub">Topple the squirrel snow forts · a Btown Games production</div>
</div>
<canvas id="iconCanvas" width="180" height="180"></canvas>
<script>
// ?icon → 180×180 app icon drawn in 2D; otherwise the live 3D scene + titles.
if (location.search.includes('icon')) {
  document.body.classList.add('icon');
  const g = document.getElementById('iconCanvas').getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 180);
  sky.addColorStop(0, '#3f6ba8'); sky.addColorStop(0.62, '#e89a5e'); sky.addColorStop(1, '#ffd9a0');
  g.fillStyle = sky; g.fillRect(0, 0, 180, 180);
  g.fillStyle = '#eef4fb';
  g.beginPath(); g.ellipse(90, 186, 122, 36, 0, 0, 7); g.fill();
  g.strokeStyle = '#7a4a28'; g.lineCap = 'round';
  g.lineWidth = 13;
  g.beginPath(); g.moveTo(90, 152); g.lineTo(90, 110); g.stroke();
  g.lineWidth = 10;
  g.beginPath(); g.moveTo(90, 114); g.lineTo(60, 68); g.stroke();
  g.beginPath(); g.moveTo(90, 114); g.lineTo(120, 68); g.stroke();
  g.strokeStyle = '#8e3b2f'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(60, 68); g.quadraticCurveTo(90, 116, 120, 68); g.stroke();
  g.fillStyle = '#ffffff';
  g.beginPath(); g.arc(90, 92, 22, 0, 7); g.fill();
  g.fillStyle = '#dfeefc';
  g.beginPath(); g.arc(83, 85, 6, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.92)';
  [[34,38,3.4],[58,24,2.6],[126,30,3],[150,52,2.6],[30,76,2.4],[148,96,2.8]]
    .forEach(([x,y,r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  g.fillStyle = '#e8a13c'; g.strokeStyle = '#c67f22'; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(143,132); g.lineTo(152,138); g.lineTo(149,148); g.lineTo(138,149); g.lineTo(134,140);
  g.closePath(); g.fill(); g.stroke();
}
</script>
</body>
</html>
