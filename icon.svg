<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6ba8"/>
      <stop offset="0.65" stop-color="#e89a5e"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="38" fill="url(#sky)"/>
  <!-- snow ground -->
  <ellipse cx="90" cy="182" rx="120" ry="34" fill="#eef4fb"/>
  <!-- slingshot -->
  <g stroke="#7a4a28" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M90 150 L90 108"/>
    <path d="M90 112 L66 76"/>
    <path d="M90 112 L114 76"/>
  </g>
  <!-- band -->
  <path d="M66 76 Q90 118 114 76" stroke="#8e3b2f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- snowball in the pouch -->
  <circle cx="90" cy="97" r="19" fill="#ffffff"/>
  <circle cx="84" cy="91" r="5" fill="#dfeefc"/>
  <!-- drifting snow -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="34" cy="38" r="3.4"/>
    <circle cx="58" cy="24" r="2.6"/>
    <circle cx="126" cy="30" r="3"/>
    <circle cx="150" cy="52" r="2.6"/>
    <circle cx="30" cy="76" r="2.4"/>
    <circle cx="148" cy="96" r="2.8"/>
  </g>
  <!-- maple candy chip -->
  <path d="M143 132 l9 6 -3 10 -11 1 -4 -9 z" fill="#e8a13c" stroke="#c67f22" stroke-width="2"/>
</svg>
